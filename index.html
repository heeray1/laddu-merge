<html lang="en">
<head>

<style>
  :root { --surface: rgba(28, 17, 11, .88); --line: rgba(255, 236, 210, .10); --text: #fff7ec; --muted: #b9a693;
    --chip: rgba(255, 236, 210, .08); --primary: #fff4e0; --ink: #24130a; --gold1: #ffdf8a; --gold2: #f2a64a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #24120a; touch-action: none; color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* in-game glass buttons (no backdrop-filter: they sit on the live canvas) */
  .hudbtns { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 12px; display: none; gap: 8px; z-index: 3; }
  .hudbtns button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(20,10,5,.55);
    color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
    font-family: inherit; transition: transform .1s; }
  .hudbtns button:active { transform: scale(.94); }
  .hudbtns svg { width: 20px; height: 20px; display: block; }
  /* overlays + cards */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5;
    background: rgba(12, 6, 3, .52); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .overlay.on { display: flex; }
  .card { width: min(360px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 30px; padding: 24px 20px 18px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); animation: cardIn .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.5px; line-height: 1.1; }
  .card p { margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--muted); }
  .brand { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
  .brand b { background: linear-gradient(90deg, var(--gold1), var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { margin-top: 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .big { font-size: 84px; font-weight: 900; line-height: 1; margin-top: 6px; color: #fff; text-shadow: 0 0 34px rgba(242,166,74,.35); }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--chip); color: #f3e6d6;
    font-weight: 800; font-size: 14px; white-space: nowrap; }
  .chip canvas { width: 20px; height: 20px; margin: -3px 0 -3px -4px; }
  .chips.how { margin-top: 12px; gap: 6px; }
  .chips.how .chip { font-size: 12.5px; padding: 6px 10px; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 16px; min-height: 54px; padding: 0 18px;
    border: 0; border-radius: 999px; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; color: var(--text); background: var(--chip);
    transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); color: var(--ink); box-shadow: 0 10px 28px rgba(255, 214, 150, .18); }
  .btn.ghost { min-height: 46px; margin-top: 10px; font-size: 16px; background: transparent; border: 1px solid rgba(255, 236, 210, .18); color: #f3e6d6; }
  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; }
  .textbtn { display: inline-block; margin-top: 12px; color: var(--muted); font-weight: 800; font-size: 14px; text-decoration: none; cursor: pointer;
    background: none; border: 0; font-family: inherit; padding: 6px 8px; }
  .tiny { font-size: 13px !important; color: var(--muted); margin-top: 10px !important; }
  #hero { display: block; width: 230px; height: 150px; margin: 6px auto -2px; }
  /* start card: mode rows (one cream primary) */
  .modes { margin-top: 16px; display: grid; gap: 8px; }
  .mode { width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 18px;
    border-radius: 18px; border: 1px solid var(--line); background: rgba(255, 236, 210, .05); color: var(--text); font: inherit;
    font-size: 17px; font-weight: 900; cursor: pointer; transition: transform .1s; white-space: nowrap; min-width: 0; text-align: left; }
  .mode:active { transform: scale(.98); }
  .mode small { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .mode.primary { background: var(--primary); color: var(--ink); border-color: transparent; box-shadow: 0 10px 28px rgba(255,214,150,.18); }
  .mode.primary small { color: #7a5a3e; }
  /* milestone gem: only on a new best */
  .gem { display: none; width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 50%; position: relative;
    background: conic-gradient(from 200deg, var(--gold1), var(--gold2), #ff8a8a, #d2a8ff, #8fe3c3, var(--gold1));
    box-shadow: 0 0 70px rgba(255, 190, 90, .7); animation: gemSpin 9s linear infinite, gemPulse 1.6s ease-in-out infinite; }
  .gem::after { content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 35%, rgba(255,255,255,0) 60%); }
  @keyframes gemSpin { to { transform: rotate(360deg); } }
  @keyframes gemPulse { 50% { filter: brightness(1.25); } }
  .newbest { display: none; margin-top: 6px; font-size: 13px; font-weight: 900; letter-spacing: .08em; color: var(--gold1); }
  .milestone .gem, .milestone .newbest { display: block; }
  @media (prefers-reduced-motion: reduce) { .card, .gem { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hudbtns" id="top">
  <button id="bhome" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg></button>
  <button id="bsnd" aria-label="Sound"></button>
</div>

<div class="overlay on" id="home"><div class="card">
  <div class="brand">Laddu <b>Merge</b></div>
  <canvas id="hero" width="460" height="300" aria-label="A pile of Indian sweets"></canvas>
  <p>Can you make the Maha Laddu?</p>
  <div class="modes">
    <button class="mode primary" id="pdaily"><span>Daily Thali</span><small id="sdaily"></small></button>
    <button class="mode" id="pendless"><span>Endless</span><small id="sendless"></small></button>
  </div>
  <div class="chips how"><span class="chip">Slide, lift to drop</span><span class="chip">2 same = 1 bigger</span><span class="chip">Stay under the line</span></div>
  <p class="tiny">Daily Thali: same sweets for everyone today</p>
</div></div>

<div class="overlay" id="over"><div class="card">
  <div class="gem" aria-hidden="true"></div>
  <div class="label" id="fmode">Endless</div>
  <h1>Thali overflow!</h1>
  <div class="big" id="fs">0</div>
  <div class="newbest" id="fnew">NEW BEST</div>
  <div class="chips"><span class="chip"><canvas id="fmi" width="40" height="40"></canvas><span id="fm">Boondi</span></span><span class="chip" id="fb">Best 0</span></div>
  <button class="btn primary" id="again">Play again</button>
  <div class="actions"><button class="btn ghost" id="share">Share</button><button class="btn ghost" id="tohome">Home</button></div>
</div></div>
<script src="vendor/matter.min.js"></script>
<script>
"use strict";
const { Engine, Bodies, Composite, Body, Events } = Matter;
const cv = document.getElementById("c"), ctx0 = cv.getContext("2d"); let ctx = ctx0;
const Q = new URLSearchParams(location.search), BOT = Q.has("bot"), ART = Q.get("art");
const $ = id => document.getElementById(id);
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

// logical world (scaled to fit any screen)
const LW=400, LH=700, L=+(Q.get("L")||44), R=LW-L, FLOOR=652, LINE=+(Q.get("line")||214), DROPY=LINE-62;
const TIERS = [
  { name:"Boondi",          r:13 },
  { name:"Peda",            r:18 },
  { name:"Gulab Jamun",     r:24 },
  { name:"Rasgulla",        r:30 },
  { name:"Motichoor Laddu", r:37 },
  { name:"Besan Laddu",     r:45 },
  { name:"Nariyal Laddu",   r:54 },
  { name:"Jalebi",          r:63 },
  { name:"Rasmalai",        r:73 },
  { name:"Maha Laddu",      r:86 },
];
const SPAWN_MAX = 4;                      // only the 5 smallest sweets are dropped
const pts = k => (k+1)*(k+2)/2;

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function niceDate(k){ return (k%100)+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][((k/100|0)%100)-1]; }

let mode="endless", seed=0, dayKey=0, startBest=0, playing=false;
let engine=null, bodies=[], queue=[], score=0, shown=0, best=0, over=true, cur=0, next=0, aimX=LW/2, canDrop=true, danger=0, fx=[], pops=[], maxTier=0, dropped=0;
const bestKey = () => mode==="daily" ? "lm_daily_"+dayKey : "lm_best";
const saveKey = m => "lm_save_"+m;

// sweet number k of a game is fixed by the seed, so the Daily Thali gives everyone the same order
function tierAt(k){ const max=Math.min(SPAWN_MAX+1, 2+Math.floor(k/4)); return (mulberry((seed ^ Math.imul(k+1,2654435761))|0)()*max)|0; }

function newWorld(){
  engine = Engine.create({ positionIterations:8, velocityIterations:6 });
  engine.gravity.y = 1.25;
  const o={ isStatic:true, friction:.4, restitution:.1 };
  Composite.add(engine.world, [
    Bodies.rectangle(LW/2, FLOOR+40, LW, 80, o),
    Bodies.rectangle(L-40, LH/2-200, 80, LH+600, o),
    Bodies.rectangle(R+40, LH/2-200, 80, LH+600, o),
  ]);
  Events.on(engine, "collisionStart", onHit);
  Events.on(engine, "collisionActive", onHit);
  bodies=[]; queue=[];
}
function addSweet(t,x,y,a=0){
  const b=Bodies.circle(x,y,TIERS[t].r,{ restitution:.18, friction:.35, frictionAir:.004, density:.0012, angle:a });
  b.tier=t; b.born=performance.now(); b.pop=b.born;
  Composite.add(engine.world,b); bodies.push(b); return b;
}
function start(m, fresh){
  mode=m; dayKey=todayKey(); newWorld();
  let s=null; if(!fresh){ try{ s=JSON.parse(LS.get(saveKey(m),"null")); }catch(e){} }
  best=+LS.get(bestKey(),0);
  if(s && (m!=="daily"||s.dayKey===dayKey) && Array.isArray(s.bodies)){
    ({ seed, dropped, score, maxTier, startBest } = s);
    for(const b of s.bodies){ const n=addSweet(b.t,b.x,b.y,b.a); n.born-=5000; n.pop-=5000; }
  } else {
    seed = m==="daily" ? dayKey : (Math.random()*2**31)|0; score=0; maxTier=0; dropped=0; startBest=best;
  }
  shown=score; over=false; danger=0; fx=[]; pops=[]; cur=tierAt(dropped); next=tierAt(dropped+1); aimX=LW/2; canDrop=true; playing=true; acc=0;
  $("home").classList.remove("on"); $("over").classList.remove("on"); $("top").style.display="flex";
}
function save(){
  if(!playing||over||BOT) return;
  LS.set(saveKey(mode), JSON.stringify({ seed, dayKey, dropped, score, maxTier, startBest,
    bodies:bodies.map(b=>({ t:b.tier, x:Math.round(b.position.x*10)/10, y:Math.round(b.position.y*10)/10, a:Math.round(b.angle*100)/100 })) }));
}
function onHit(ev){
  for(const p of ev.pairs){ const a=p.bodyA, b=p.bodyB;
    if(a.tier===undefined||a.tier!==b.tier||a.gone||b.gone) continue;
    a.gone=b.gone=true; queue.push([a,b]); }
}
function doMerges(){
  for(const [a,b] of queue){
    Composite.remove(engine.world,a); Composite.remove(engine.world,b);
    bodies=bodies.filter(x=>x!==a&&x!==b);
    const x=(a.position.x+b.position.x)/2, y=(a.position.y+b.position.y)/2, t=a.tier, now=performance.now();
    let gain;
    if(t===TIERS.length-1){ gain=300; pops.push({text:"DOUBLE MAHA! +300",x,y,t:now}); snd("big"); }
    else {
      const n=addSweet(t+1, Math.min(Math.max(x,L+TIERS[t+1].r),R-TIERS[t+1].r), y);
      Body.setVelocity(n,{ x:(a.velocity.x+b.velocity.x)/2, y:(a.velocity.y+b.velocity.y)/2 });
      Body.setAngle(n,a.angle); n.born-=5000;          // merged sweets count for the overflow line at once
      gain=pts(t+1);
      if(t+1===TIERS.length-1){ gain+=100; pops.push({text:"MAHA LADDU!  +"+gain,x,y,t:now}); snd("big"); }
      else if(t+1>maxTier&&t+1>=5){ pops.push({text:TIERS[t+1].name+"!",x,y,t:now}); snd("big"); }
      else snd("merge",t);
      maxTier=Math.max(maxTier,t+1);
    }
    fx.push({x,y,r:TIERS[Math.min(t+1,TIERS.length-1)].r,t:now});
    score+=gain; if(score>best){ best=score; LS.set(bestKey(),best); }
    if(navigator.vibrate&&!BOT) navigator.vibrate(12);
  }
  queue.length=0;
}
function drop(){
  if(over||!canDrop||!playing) return;
  const r=TIERS[cur].r; addSweet(cur, Math.min(Math.max(aimX,L+r+1),R-r-1), DROPY);
  dropped++; snd("drop"); canDrop=false; cur=next; next=tierAt(dropped+1);
  setTimeout(()=>{ canDrop=true; }, 520);
}
function endGame(){
  over=true; LS.del(saveKey(mode)); snd("over");
  setTimeout(()=>{ if(!over) return;
    $("fs").textContent=score; $("fmode").textContent = mode==="daily" ? "Daily Thali · "+niceDate(dayKey) : "Endless";
    $("fm").textContent=TIERS[maxTier].name+" · "+(maxTier+1)+"/10";
    ctx=$("fmi").getContext("2d"); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,40,40); drawSweet(maxTier,20,19,17,0); ctx=ctx0;
    $("fb").textContent="🏆 Best "+best;
    $("over").classList.toggle("milestone", score>startBest && score>0);
    $("over").classList.add("on"); }, 900);
}
function goHome(){
  save(); playing=false; $("over").classList.remove("on"); $("top").style.display="none";
  const k=todayKey(), has=m=>{ try{ const s=JSON.parse(LS.get(saveKey(m),"null")); return s&&(m!=="daily"||s.dayKey===k)?s:null; }catch(e){ return null; } };
  const d=has("daily"), e=has("endless");
  $("sdaily").textContent = niceDate(k)+" · "+(d ? "continue at "+d.score : "best "+LS.get("lm_daily_"+k,0));
  $("sendless").textContent = e ? "continue at "+e.score+" · best "+LS.get("lm_best",0) : "best "+LS.get("lm_best",0);
  $("home").classList.add("on"); drawHero();
}

// ---------- sound ----------
let ac=null, muted=LS.get("lm_mute","0")==="1";
function snd(kind,t=0){
  if(BOT||muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume();
    const n=ac.currentTime;
    const tone=(f,d,at,type="sine",v=.15)=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(f,n+at); g.gain.setValueAtTime(.0001,n+at); g.gain.exponentialRampToValueAtTime(v,n+at+.008);
      g.gain.exponentialRampToValueAtTime(.001,n+at+d); o.connect(g).connect(ac.destination); o.start(n+at); o.stop(n+at+d+.02); };
    if(kind==="drop") tone(300,.07,0,"triangle",.1);
    if(kind==="merge"){ const f=420*Math.pow(1.122,t*2); tone(f,.1,0); tone(f*1.5,.14,.06); }
    if(kind==="big"){ tone(660,.1,0); tone(880,.1,.07); tone(1100,.12,.14); tone(1320,.26,.21); }
    if(kind==="over"){ tone(392,.2,0,"triangle"); tone(311,.2,.18,"triangle"); tone(233,.5,.36,"triangle"); }
  }catch(e){}
}

// ---------- layout ----------
let W,H,D,S,OX,OY;
function layout(){
  D=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=W*D; cv.height=H*D; S=Math.min(W/LW,H/LH); OX=(W-LW*S)/2; OY=(H-LH*S)/2;
  const k=Math.max(1,S);                                             // tablets/laptops: bigger buttons + cards, cards still fit
  $("top").style.zoom=k;
  for(const el of document.querySelectorAll(".card")) el.style.zoom=Math.max(.8,Math.min(k,(H-24)/600));
}

// ---------- backdrop: halwai counter photo, baked once (dimmed, top faded into the background) ----------
let shopImg=null, shopBaked=null; const SHOP_COUNTER=624/686;      // counter-top line in the picture (fraction of its height)
{ const im=new Image(); im.onload=()=>{ shopImg=im; }; im.src="assets/backdrop.jpg"; }
function bakeShop(){
  if(!shopImg||shopBaked) return;
  const c=document.createElement("canvas"); c.width=shopImg.naturalWidth; c.height=shopImg.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(shopImg,0,0);
  g.globalCompositeOperation="source-atop"; g.fillStyle="rgba(40,18,8,.42)"; g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation="destination-in";
  const f=g.createLinearGradient(0,0,0,c.height); f.addColorStop(0,"rgba(0,0,0,0)"); f.addColorStop(.38,"rgba(0,0,0,1)"); f.addColorStop(1,"rgba(0,0,0,1)");
  g.fillStyle=f; g.fillRect(0,0,c.width,c.height); shopBaked=c;
}
function drawBackdrop(){                                             // screen space
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#1c0e07"); bg.addColorStop(1,"#2e170c");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const gl=ctx.createRadialGradient(W/2,H*.18,0,W/2,H*.18,Math.max(W,H)*.6);   // warm lamp glow
  gl.addColorStop(0,"rgba(255,170,80,.10)"); gl.addColorStop(1,"rgba(255,170,80,0)"); ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
  bakeShop();
  const base=OY+(FLOOR+14)*S;                                        // the jar stands on the shop counter
  ctx.fillStyle="#2a140a"; ctx.fillRect(0,base,W,H-base);
  if(shopBaked){
    const sw=Math.max(W,820*S), sh=sw*shopBaked.height/shopBaked.width;
    ctx.drawImage(shopBaked,(W-sw)/2,base-sh*SHOP_COUNTER,sw,sh);
    const y2=base+sh*(1-SHOP_COUNTER); if(y2<H){ ctx.fillStyle="#24110a"; ctx.fillRect(0,y2,W,H-y2); }
  }
  const cx=OX+LW*S/2, v=ctx.createRadialGradient(cx,H*.55,LW*S*.45,cx,H*.55,Math.max(W,H)*.75);   // calm the photo away from the jar
  v.addColorStop(0,"rgba(16,7,3,0)"); v.addColorStop(1,"rgba(16,7,3,.55)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

// ---------- sweets ----------
function ball(r,c0,c1,c2){ const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  g.addColorStop(0,c0); g.addColorStop(.6,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); }
function dots(r,n,col,size,seed){ ctx.fillStyle=col;
  for(let i=0;i<n;i++){ const a=i*2.399+seed, d=r*.86*Math.sqrt((i+.5)/n); ctx.beginPath(); ctx.arc(Math.cos(a)*d,Math.sin(a)*d,size,0,7); ctx.fill(); } }
function drawSweet(t,x,y,r,ang,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y);
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.arc(0,r*.08,r,0,7); ctx.fill();
  ctx.rotate(ang);
  switch(t){
    case 0: ball(r,"#ffd257","#f4a511","#c97c06"); break;
    case 1: ball(r,"#fff0cf","#ecca8c","#c39a55");
      ctx.fillStyle="#5c9a34"; ctx.beginPath(); ctx.ellipse(0,0,r*.34,r*.2,.5,0,7); ctx.fill(); break;
    case 2: ball(r,"#b5562a","#7b2e12","#4a1806"); break;
    case 3: ball(r,"#ffffff","#fbf3e2","#d9cbb0"); dots(r,7,"rgba(190,170,130,.35)",r*.06,1); break;
    case 4: ball(r,"#ffb347","#f0851a","#bb5a06"); dots(r,26,"rgba(255,214,120,.75)",r*.085,0); dots(r,14,"rgba(160,70,0,.35)",r*.06,2); break;
    case 5: ball(r,"#f8dc8a","#dfae45","#a97a1e"); dots(r,12,"rgba(150,100,20,.3)",r*.05,1);
      ctx.fillStyle="#f6e3c0"; ctx.beginPath(); ctx.ellipse(0,0,r*.26,r*.15,-.4,0,7); ctx.fill(); break;
    case 6: ball(r,"#ffffff","#f6f1ea","#cfc6ba"); ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.lineWidth=r*.05; ctx.lineCap="round";
      for(let i=0;i<34;i++){ const a=i*2.399, d=r*.9*Math.sqrt((i+.5)/34), px=Math.cos(a)*d, py=Math.sin(a)*d, q=i*1.7;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(q)*r*.12,py+Math.sin(q)*r*.12); ctx.stroke(); }
      dots(r,6,"rgba(240,120,150,.55)",r*.07,3); break;
    case 7: ctx.fillStyle="rgba(255,190,60,.25)"; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      for(const [w,c] of [[r*.2,"#b85e05"],[r*.14,"#f79a12"],[r*.05,"#ffd27a"]]){
        ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap="round"; ctx.beginPath();
        for(let a=0;a<=Math.PI*5.4;a+=.15){ const d=r*.08+(r*.8)*(a/(Math.PI*5.4)); const px=Math.cos(a)*d, py=Math.sin(a)*d; a?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.stroke(); } break;
    case 8: ball(r,"#fffbe8","#f6e6ad","#d2b96a"); dots(r,5,"#5c9a34",r*.07,1);
      ctx.strokeStyle="#c8401a"; ctx.lineWidth=r*.035; ctx.lineCap="round";
      for(let i=0;i<5;i++){ const a=i*1.3; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*.2,Math.sin(a)*r*.2); ctx.lineTo(Math.cos(a+.5)*r*.42,Math.sin(a+.5)*r*.42); ctx.stroke(); } break;
    case 9: ball(r,"#fff3b0","#f5b61a","#b97905"); dots(r,40,"rgba(255,235,150,.8)",r*.06,0);
      ctx.fillStyle="#fff"; ctx.globalAlpha*=.9;
      for(const [sx,sy,ss] of [[-.4,-.45,.16],[.45,-.2,.1],[.1,.5,.09]]){ ctx.beginPath();
        for(let i=0;i<8;i++){ const a=i*Math.PI/4, d=r*ss*(i%2?.35:1); ctx.lineTo(sx*r+Math.cos(a)*d, sy*r+Math.sin(a)*d); } ctx.closePath(); ctx.fill(); } break;
  }
  ctx.rotate(-ang);
  const gl=ctx.createRadialGradient(-r*.35,-r*.42,0,-r*.35,-r*.42,r*.5);
  gl.addColorStop(0,"rgba(255,255,255,.5)"); gl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  ctx.restore();
}
// a small pile used for the home screen and the store art: [tier, x, y, r] in a 460x300 box
const PILE=[[9,230,170,112],[6,92,222,62],[7,372,214,70],[4,150,92,40],[5,330,96,46],[3,52,130,32],[2,410,112,26],[1,262,40,20],[0,198,34,14],[0,300,34,13],[8,236,60,0]];
function drawPile(x,y,k){ for(const [t,px,py,r] of PILE) if(r) drawSweet(t,x+px*k,y+py*k,r*k,t*.7); }
function drawHero(){ ctx=$("hero").getContext("2d"); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,460,300); drawPile(0,0,1); ctx=ctx0; }
function drawArt(){
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#5a2a0e"); bg.addColorStop(1,"#1f0d04"); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(ART==="icon"){ drawSweet(9,W*.5,W*.52,W*.36,.3); drawSweet(4,W*.2,W*.2,W*.13,1); drawSweet(2,W*.82,W*.2,W*.09,0); drawSweet(0,W*.84,W*.84,W*.06,0); return; }
  const k=H/400; drawPile(W-460*k-H*.03,H*.12,k);
  ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillStyle="#fff"; ctx.font="800 "+H*.17+"px ui-rounded,system-ui";
  ctx.fillText("Laddu",H*.12,H*.33); ctx.fillText("Merge",H*.12,H*.51);
  ctx.fillStyle="#ffcf7a"; ctx.font="700 "+H*.058+"px ui-rounded,system-ui"; ctx.fillText("Can you make",H*.125,H*.68); ctx.fillText("the Maha Laddu?",H*.125,H*.755);
}

// ---------- loop ----------
const STEP=1000/60; let last=0, acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(now-(last||now),100); last=now;
  if(playing&&!over){
    acc+=dt; let n=0;
    while(acc>=STEP&&n<4){ Engine.update(engine,STEP); doMerges(); acc-=STEP; n++; }
    if(n===4) acc=0;
    // overflow check: a settled sweet poking above the line
    const high=bodies.some(b=>now-b.born>1300 && b.position.y-TIERS[b.tier].r<LINE);
    danger = high ? danger+dt : Math.max(0,danger-dt*2);
    if(danger>2600) endGame();
  }
  draw(now);
}
function draw(now){
  ctx.setTransform(D,0,0,D,0,0);
  if(ART){ drawArt(); return; }
  drawBackdrop();
  if(!playing) return;
  ctx.translate(OX,OY); ctx.scale(S,S);

  // glass jar (drawing only: the physics walls are x<L, x>R and the floor at FLOOR)
  const JT=LINE-90, GW=10, JB=FLOOR+14;
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(LW/2,JB+2,(R-L)/2+30,9,0,0,7); ctx.fill();      // contact shadow
  ctx.save(); ctx.beginPath(); ctx.roundRect(L-GW,JT,R-L+2*GW,JB-JT,[8,8,26,26]); ctx.clip();
  ctx.fillStyle="rgba(18,9,4,.6)"; ctx.fillRect(L-GW,JT,R-L+2*GW,JB-JT);                                       // keeps sweets readable
  const gf=ctx.createLinearGradient(0,JT,0,JB); gf.addColorStop(0,"rgba(255,244,224,.03)"); gf.addColorStop(.7,"rgba(255,236,210,.07)"); gf.addColorStop(1,"rgba(255,220,180,.13)");
  ctx.fillStyle=gf; ctx.fillRect(L-GW,JT,R-L+2*GW,JB-JT);
  const stripe=(x,w,a)=>{ const g=ctx.createLinearGradient(0,JT,0,FLOOR); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.18,`rgba(255,255,255,${a})`);
    g.addColorStop(.75,`rgba(255,255,255,${a*.6})`); g.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g; ctx.fillRect(x,JT,w,FLOOR-JT); };
  stripe(L+10,14,.07); stripe(L+28,4,.06); stripe(R-20,6,.045);                                                   // soft reflections
  for(const [x0,dir] of [[L-GW,1],[R,-1]]){                                                                     // glass walls: bright edges
    const g=ctx.createLinearGradient(x0,0,x0+GW,0);
    g.addColorStop(0,`rgba(255,255,255,${dir>0?.42:.16})`); g.addColorStop(.5,"rgba(255,248,236,.10)"); g.addColorStop(1,`rgba(255,255,255,${dir>0?.18:.36})`);
    ctx.fillStyle=g; ctx.fillRect(x0,JT,GW,JB-JT);
  }
  const bg2=ctx.createLinearGradient(0,FLOOR,0,JB); bg2.addColorStop(0,"rgba(255,240,220,.30)"); bg2.addColorStop(.3,"rgba(120,70,40,.55)"); bg2.addColorStop(1,"rgba(40,18,8,.85)");
  ctx.fillStyle=bg2; ctx.fillRect(L-GW,FLOOR,R-L+2*GW,JB-FLOOR);                                                  // thick dark base
  ctx.restore();
  ctx.strokeStyle="rgba(255,240,220,.28)"; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(L-GW,JT,R-L+2*GW,JB-JT,[8,8,26,26]); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.beginPath(); ctx.moveTo(L,JT+8); ctx.lineTo(L,FLOOR); ctx.moveTo(R,JT+8); ctx.lineTo(R,FLOOR); ctx.stroke();
  const rim=ctx.createLinearGradient(0,JT-5,0,JT+6); rim.addColorStop(0,"rgba(255,255,255,.95)"); rim.addColorStop(.5,"rgba(255,246,230,.55)"); rim.addColorStop(1,"rgba(255,240,220,.15)");
  ctx.fillStyle=rim; ctx.beginPath(); ctx.roundRect(L-GW-4,JT-5,R-L+2*GW+8,11,5.5); ctx.fill();                   // rim / lip
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.fillRect(L-GW+4,JT-4,R-L+2*GW-8,1.5);

  // overflow line
  const warn=danger>300;
  if(warn){ const wg=ctx.createLinearGradient(0,JT,0,LINE); wg.addColorStop(0,"rgba(255,60,40,0)"); wg.addColorStop(1,`rgba(255,60,40,${.16+.1*Math.sin(now/90)})`);
    ctx.fillStyle=wg; ctx.fillRect(L,JT+6,R-L,LINE-JT-6); }
  ctx.setLineDash([8,8]); ctx.lineCap="round";
  ctx.strokeStyle="rgba(20,8,3,.55)"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(L+4,LINE); ctx.lineTo(R-4,LINE); ctx.stroke();
  ctx.strokeStyle= warn ? `rgba(255,90,70,${.6+.4*Math.sin(now/90)})` : "rgba(255,244,224,.5)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(L+4,LINE); ctx.lineTo(R-4,LINE); ctx.stroke(); ctx.setLineDash([]); ctx.lineCap="butt";

  for(const b of bodies){ const k=Math.min(1,(now-b.pop)/140), r=TIERS[b.tier].r*(.75+.25*k);
    drawSweet(b.tier,b.position.x,b.position.y,r,b.angle,over?.6:1); }

  // merge sparkle
  fx=fx.filter(e=>now-e.t<350);
  for(const e of fx){ const k=(now-e.t)/350; ctx.strokeStyle=`rgba(255,225,140,${1-k})`; ctx.lineWidth=4*(1-k);
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(1+k*.7),0,7); ctx.stroke(); }

  // aimer
  if(!over){
    const r=TIERS[cur].r, x=Math.min(Math.max(aimX,L+r+1),R-r-1);
    ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=2; ctx.setLineDash([4,9]);
    ctx.beginPath(); ctx.moveTo(x,DROPY+r); ctx.lineTo(x,FLOOR); ctx.stroke(); ctx.setLineDash([]);
    drawSweet(cur,x,DROPY,r,0,canDrop?1:.35);
  }

  // HUD: muted small-caps labels, white numbers
  shown+=(score-shown)*.2; if(Math.abs(score-shown)<.5) shown=score;
  ctx.textBaseline="middle"; ctx.textAlign="center";
  const cap=(t,x,y,a=1)=>{ ctx.fillStyle=`rgba(185,166,147,${a})`; ctx.font="800 11.5px ui-rounded,system-ui"; if("letterSpacing" in ctx) ctx.letterSpacing="1.2px";
    ctx.fillText(t,x,y); if("letterSpacing" in ctx) ctx.letterSpacing="0px"; };
  cap(mode==="daily" ? "DAILY THALI · "+niceDate(dayKey).toUpperCase() : "ENDLESS",LW/2,20);
  ctx.save(); ctx.shadowColor="rgba(242,166,74,.45)"; ctx.shadowBlur=22; ctx.fillStyle="#fff"; ctx.font="900 46px ui-rounded,system-ui";
  ctx.fillText(Math.round(shown),LW/2,54); ctx.restore();
  cap("BEST "+best,LW/2,88);
  cap("NEXT",LW-40,20);
  ctx.fillStyle="rgba(20,10,5,.55)"; ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(LW-40,56,24,0,7); ctx.fill(); ctx.stroke();
  drawSweet(next,LW-40,56,Math.min(TIERS[next].r,18),0);

  // ladder of sweets on a glass shelf along the bottom
  const n=TIERS.length, gap=(LW-40)/n;
  ctx.fillStyle="rgba(20,10,5,.55)"; ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(14,FLOOR+18,LW-28,26,13); ctx.fill(); ctx.stroke();
  for(let i=0;i<n;i++) drawSweet(i,20+gap*(i+.5),FLOOR+31,5.5+i*.95,0,i<=Math.max(maxTier,SPAWN_MAX)?1:.28);

  pops=pops.filter(p=>now-p.t<1100);
  for(const p of pops){ const k=(now-p.t)/1100; ctx.globalAlpha=1-k*k; ctx.textAlign="center"; ctx.font="800 22px ui-rounded,system-ui";
    ctx.lineWidth=5; ctx.lineJoin="round"; ctx.strokeStyle="rgba(36,19,10,.9)"; ctx.fillStyle="#ffdf8a";
    const X=Math.min(Math.max(p.x,120),LW-120), Y=p.y-30-k*40; ctx.strokeText(p.text,X,Y); ctx.fillText(p.text,X,Y); ctx.globalAlpha=1; }

  if(dropped===0){ ctx.fillStyle="rgba(255,247,236,.85)"; ctx.font="800 14px ui-rounded,system-ui"; ctx.textAlign="center";
    ctx.fillText("Slide to aim, lift to drop",LW/2,360); }
}

// ---------- input ----------
const toX=e=>(e.clientX-OX)/S;
let down=false;
cv.addEventListener("pointerdown",e=>{ if(BOT||!playing) return; down=true; aimX=toX(e); });
cv.addEventListener("pointermove",e=>{ if(BOT||!playing) return; if(down||e.pointerType==="mouse") aimX=toX(e); });
cv.addEventListener("pointerup",e=>{ if(BOT||!down) return; down=false; aimX=toX(e); drop(); });
cv.addEventListener("pointercancel",()=>{ down=false; });
addEventListener("resize",layout);
addEventListener("pagehide",save); setInterval(save,2500);
$("pdaily").onclick=()=>start("daily"); $("pendless").onclick=()=>start("endless");
$("again").onclick=()=>start(mode,true); $("tohome").onclick=goHome; $("bhome").onclick=goHome;
function sndIcon(){ $("bsnd").style.opacity=muted?.55:1; $("bsnd").setAttribute("aria-pressed",muted?"true":"false");
  $("bsnd").innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>'+
    (muted?'<path d="m16 9.5 5 5m0-5-5 5"/>':'<path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>')+'</svg>'; }
$("bsnd").onclick=()=>{ muted=!muted; LS.set("lm_mute",muted?"1":"0"); sndIcon(); if(!muted) snd("drop"); };
$("share").onclick=()=>{
  const url="https://heeray1.github.io/laddu-merge/";
  const text="Laddu Merge 🟠 "+(mode==="daily" ? "Daily Thali "+niceDate(dayKey)+": " : "")+"I scored "+score+" and made a "+TIERS[maxTier].name+" ("+(maxTier+1)+"/10). Can you make the Maha Laddu?";
  if(navigator.share&&location.protocol==="https:") navigator.share({ text, url }).catch(()=>{});
  else window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank");
};

// ---------- test hooks: ?bot=ms drops at random spots (add &mode=daily), ?art=icon|share draws store art ----------
window.__state=()=>({ mode, score, best, over, count:bodies.length, maxTier, dropped, cur, next });

layout(); sndIcon(); requestAnimationFrame(frame);
if(ART){ $("home").classList.remove("on"); }
else if(BOT||Q.has("mode")){ start(Q.get("mode")==="daily"?"daily":"endless", BOT);
  if(BOT) setInterval(()=>{ if(over||!canDrop) return; aimX=L+Math.random()*(R-L); drop(); }, +(Q.get("bot")||600)); }
else goHome();
</script>
